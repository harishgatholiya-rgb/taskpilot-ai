name: TaskPilotAI
options:
  bundleIdPrefix: com.sideways
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES

targets:
  TaskPilotAI:
    type: application
    platform: iOS
    sources:
      - path: TaskPilotAI
    info:
      path: TaskPilotAI/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: TaskPilot AI
        NSUserNotificationsUsageDescription: TaskPilot AI uses notifications to remind you about upcoming and overdue tasks.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sideways.taskpilotai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
    dependencies: []
    scheme:
      testTargets:
        - TaskPilotAITests
        - TaskPilotAIUITests
      gatherCoverageData: true

  TaskPilotAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaskPilotAITests
    dependencies:
      - target: TaskPilotAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sideways.taskpilotai.tests

  TaskPilotAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaskPilotAIUITests
    dependencies:
      - target: TaskPilotAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sideways.taskpilotai.uitests

schemes:
  TaskPilotAI:
    build:
      targets:
        TaskPilotAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TaskPilotAITests
        - TaskPilotAIUITests
    archive:
      config: Release
