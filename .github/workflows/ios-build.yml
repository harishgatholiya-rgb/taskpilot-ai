name: iOS Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project TaskPilotAI.xcodeproj \
            -scheme TaskPilotAI \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest"

      - name: Test
        run: |
          xcodebuild test \
            -project TaskPilotAI.xcodeproj \
            -scheme TaskPilotAI \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest"
